  <g>
    <rect class="tbl" x="70" y="140" width="320" height="68" rx="4"/>
    <path class="hdr" d="M70,144 a4,4 0 0 1 4,-4 h312 a4,4 0 0 1 4,4 v22 h-320 z"/>
    <rect x="70" y="140" width="320" height="68" rx="4" fill="none" stroke="#C9D2CE" stroke-width="1.5"/>
    <text class="name" x="82" y="161">companies</text>
    <text class="col"  x="82" y="185">Id</text><text class="tag" x="118" y="185">PK</text>
    <text class="col"  x="82" y="202">NameNormalized</text><text class="type" x="192" y="202">generated, lower(Name)</text><text class="tag" x="338" y="202">UNIQUE</text>
  </g>

  <g>
    <rect class="tbl" x="70" y="250" width="320" height="88" rx="4"/>
    <path class="hdr" d="M70,254 a4,4 0 0 1 4,-4 h312 a4,4 0 0 1 4,4 v22 h-320 z"/>
    <rect x="70" y="250" width="320" height="88" rx="4" fill="none" stroke="#C9D2CE" stroke-width="1.5"/>
