<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="erdTitle erdDesc" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="erdTitle">JobKeep database schema, as of migration AtsCheckPhase5</title>
  <desc id="erdDesc">Entity-relationship diagram of 13 PostgreSQL tables. companies feeds job_postings, which feeds job_applications, ai_analyses, job_requirements and posting_skills. resumes feeds resume_skills, resume_experiences, resume_educations, and is referenced by both job_applications and ats_results. The shared skills table is joined from both posting_skills and resume_skills. document_imports stands alone with no foreign keys. Solid dark-green edges are ON DELETE RESTRICT; dashed rust edges are ON DELETE CASCADE.</desc>

  <rect x="0" y="0" width="1280" height="760" fill="#FBFCFB"/>

  <defs>
    <marker id="restrictArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E5F58"/>
    </marker>
    <marker id="cascadeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A8402F"/>
    </marker>
  </defs>

  <style>
    .tbl   { fill:#FFFFFF; stroke:#C9D2CE; stroke-width:1.5; }
    .hdr   { fill:#E8EEEB; }
    .name  { fill:#16211F; font-size:15px; font-weight:600; }
    .col   { fill:#16211F; font-size:12px; }
    .type  { fill:#5B6C68; font-size:12px; }
    .card  { fill:#5B6C68; font-size:11.5px; }
    .rule  { stroke:#0E5F58; stroke-width:2; fill:none; }
    .casc  { stroke:#A8402F; stroke-width:2; fill:none; stroke-dasharray:7 4; }
    .h1    { fill:#16211F; font-size:20px; font-weight:600; }
    .sub   { fill:#5B6C68; font-size:12.5px; }
    .tag   { fill:#0E5F58; font-size:10.5px; font-weight:600; }
  </style>

  <text class="h1" x="40" y="42">JobKeep — database schema</text>
  <text class="sub" x="40" y="63">13 tables · derived from `dotnet ef migrations script`, not from the model classes · migration AtsCheckPhase5 (Phase 5)</text>

  <!-- ============ row 1 (y=100) ============ -->
  <g>
    <rect class="tbl" x="280" y="100" width="200" height="86" rx="4"/>
    <rect class="hdr" x="280" y="100" width="200" height="26" rx="4"/>
    <rect class="hdr" x="280" y="118" width="200" height="8"/>
    <text class="name" x="292" y="119">ai_analyses</text>
    <text class="col"  x="292" y="143">Id <tspan class="tag">PK</tspan></text>
    <text class="col"  x="292" y="161">PostingId <tspan class="tag">FK · UNIQUE</tspan></text>
    <text class="type" x="292" y="178">Seniority text · Summary text</text>
  </g>

  <g>
    <rect class="tbl" x="520" y="100" width="200" height="86" rx="4"/>
    <rect class="hdr" x="520" y="100" width="200" height="26" rx="4"/>
    <rect class="hdr" x="520" y="118" width="200" height="8"/>
    <text class="name" x="532" y="119">ats_results</text>
    <text class="col"  x="532" y="141">ApplicationId <tspan class="tag">FK · UNIQUE</tspan></text>
    <text class="col"  x="532" y="159">ResumeId <tspan class="tag">FK?</tspan></text>
    <text class="type" x="532" y="177">5 × text[] · Warning text</text>
  </g>

  <!-- ============ row 2 (y=250) ============ -->
  <g>
    <rect class="tbl" x="40" y="250" width="200" height="86" rx="4"/>
    <rect class="hdr" x="40" y="250" width="200" height="26" rx="4"/>
    <rect class="hdr" x="40" y="268" width="200" height="8"/>
    <text class="name" x="52" y="269">companies</text>
    <text class="col"  x="52" y="293">Id <tspan class="tag">PK</tspan></text>
    <text class="col"  x="52" y="311">Name <tspan class="tag">UNIQUE</tspan></text>
    <text class="type" x="52" y="328">varchar(200)</text>
  </g>

  <g>
    <rect class="tbl" x="280" y="250" width="200" height="86" rx="4"/>
    <rect class="hdr" x="280" y="250" width="200" height="26" rx="4"/>
    <rect class="hdr" x="280" y="268" width="200" height="8"/>
    <text class="name" x="292" y="269">job_postings</text>
    <text class="col"  x="292" y="293">Id <tspan class="tag">PK</tspan></text>
    <text class="col"  x="292" y="311">CompanyId <tspan class="tag">FK</tspan></text>
    <text class="type" x="292" y="328">Salary numeric(12,2)</text>
  </g>

  <g>
    <rect class="tbl" x="520" y="250" width="200" height="86" rx="4"/>
    <rect class="hdr" x="520" y="250" width="200" height="26" rx="4"/>
    <rect class="hdr" x="520" y="268" width="200" height="8"/>
    <text class="name" x="532" y="269">job_applications</text>
    <text class="col"  x="532" y="293">Id <tspan class="tag">PK</tspan></text>
    <text class="col"  x="532" y="311">PostingId <tspan class="tag">FK</tspan> · ResumeId <tspan class="tag">FK?</tspan></text>
    <text class="type" x="532" y="328">Status text · DateApplied date</text>
  </g>

  <g>
    <rect class="tbl" x="760" y="250" width="200" height="86" rx="4"/>
    <rect class="hdr" x="760" y="250" width="200" height="26" rx="4"/>
    <rect class="hdr" x="760" y="268" width="200" height="8"/>
    <text class="name" x="772" y="269">resumes</text>
    <text class="col"  x="772" y="291">Id <tspan class="tag">PK</tspan> · Label <tspan class="tag">UNIQUE</tspan></text>
    <text class="col"  x="772" y="309">SourceText text</text>
    <text class="type" x="772" y="327">SourceFormat text — detected, not the extension</text>
  </g>

  <g>
    <rect class="tbl" x="1000" y="250" width="200" height="86" rx="4"/>
    <rect class="hdr" x="1000" y="250" width="200" height="26" rx="4"/>
    <rect class="hdr" x="1000" y="268" width="200" height="8"/>
    <text class="name" x="1012" y="269">resume_experiences</text>
    <text class="col"  x="1012" y="293">Id <tspan class="tag">PK</tspan></text>
    <text class="col"  x="1012" y="311">ResumeId <tspan class="tag">FK</tspan></text>
    <text class="type" x="1012" y="328">Highlights text[]</text>
  </g>

  <!-- ============ row 3 (y=400) ============ -->
  <g>
    <rect class="tbl" x="40" y="400" width="200" height="86" rx="4"/>
    <rect class="hdr" x="40" y="400" width="200" height="26" rx="4"/>
    <rect class="hdr" x="40" y="418" width="200" height="8"/>
    <text class="name" x="52" y="419">job_requirements</text>
    <text class="col"  x="52" y="443">Id <tspan class="tag">PK</tspan></text>
    <text class="col"  x="52" y="461">PostingId <tspan class="tag">FK</tspan></text>
    <text class="type" x="52" y="478">Kind text · IsMustHave bool</text>
  </g>

  <g>
    <rect class="tbl" x="280" y="400" width="200" height="86" rx="4"/>
    <rect class="hdr" x="280" y="400" width="200" height="26" rx="4"/>
    <rect class="hdr" x="280" y="418" width="200" height="8"/>
    <text class="name" x="292" y="419">posting_skills</text>
    <text class="col"  x="292" y="443">(PostingId, SkillId) <tspan class="tag">PK</tspan></text>
    <text class="col"  x="292" y="461">both <tspan class="tag">FK</tspan></text>
    <text class="type" x="292" y="478">Source text · IsRequired bool</text>
  </g>

  <g>
    <rect class="tbl" x="520" y="400" width="200" height="86" rx="4"/>
    <rect class="hdr" x="520" y="400" width="200" height="26" rx="4"/>
    <rect class="hdr" x="520" y="418" width="200" height="8"/>
    <text class="name" x="532" y="419">skills</text>
    <text class="col"  x="532" y="443">Id <tspan class="tag">PK</tspan></text>
    <text class="col"  x="532" y="461">Name <tspan class="tag">UNIQUE</tspan></text>
    <text class="type" x="532" y="478">shared — owned by no module</text>
  </g>

  <g>
    <rect class="tbl" x="760" y="400" width="200" height="86" rx="4"/>
    <rect class="hdr" x="760" y="400" width="200" height="26" rx="4"/>
    <rect class="hdr" x="760" y="418" width="200" height="8"/>
    <text class="name" x="772" y="419">resume_skills</text>
    <text class="col"  x="772" y="443">(ResumeId, SkillId) <tspan class="tag">PK</tspan></text>
    <text class="col"  x="772" y="461">both <tspan class="tag">FK</tspan></text>
    <text class="type" x="772" y="478">Source text</text>
  </g>

  <g>
    <rect class="tbl" x="1000" y="400" width="200" height="86" rx="4"/>
    <rect class="hdr" x="1000" y="400" width="200" height="26" rx="4"/>
    <rect class="hdr" x="1000" y="418" width="200" height="8"/>
    <text class="name" x="1012" y="419">resume_educations</text>
    <text class="col"  x="1012" y="443">Id <tspan class="tag">PK</tspan></text>
    <text class="col"  x="1012" y="461">ResumeId <tspan class="tag">FK</tspan></text>
    <text class="type" x="1012" y="478">YearText varchar(50)</text>
  </g>

  <!-- ============ detached ============ -->
  <g>
    <rect class="tbl" x="40" y="560" width="290" height="100" rx="4" stroke-dasharray="5 4"/>
    <rect class="hdr" x="40" y="560" width="290" height="26" rx="4"/>
    <rect class="hdr" x="40" y="578" width="290" height="8"/>
    <text class="name" x="52" y="579">document_imports</text>
    <text class="col"  x="52" y="603">Id <tspan class="tag">PK</tspan> · Status <tspan class="tag">INDEX</tspan></text>
    <text class="col"  x="52" y="621">ExtractedText text · DraftJson jsonb</text>
    <text class="type" x="52" y="639">CommittedEntityId uuid — deliberately NOT a FK:</text>
    <text class="type" x="52" y="654">it points at resumes OR job_applications.</text>
  </g>
  <text class="sub" x="352" y="600">The review queue. An upload writes one row here and</text>
  <text class="sub" x="352" y="618">nothing else; the rows above come into existence only</text>
  <text class="sub" x="352" y="636">when a human confirms the draft (Phase 4.5).</text>

  <!-- ============ edges ============ -->

  <!-- companies -> job_postings : RESTRICT -->
  <path class="rule" d="M 240 293 H 280" marker-end="url(#restrictArrow)"/>
  <text class="card" x="243" y="286">1 : N</text>

  <!-- job_postings -> ai_analyses : CASCADE, 1:1 (unique FK) -->
  <path class="casc" d="M 380 250 V 186" marker-end="url(#cascadeArrow)"/>
  <text class="card" x="388" y="222">1 : 1</text>

  <!-- job_postings -> job_applications : RESTRICT -->
  <path class="rule" d="M 480 293 H 520" marker-end="url(#restrictArrow)"/>
  <text class="card" x="483" y="286">1 : N</text>

  <!-- job_postings -> posting_skills : CASCADE -->
  <path class="casc" d="M 380 336 V 400" marker-end="url(#cascadeArrow)"/>
  <text class="card" x="388" y="372">1 : N</text>

  <!-- job_postings -> job_requirements : CASCADE -->
  <path class="casc" d="M 300 336 V 368 H 140 V 400" marker-end="url(#cascadeArrow)"/>
  <text class="card" x="150" y="362">1 : N</text>

  <!-- job_applications -> ats_results : CASCADE, 1:1 -->
  <path class="casc" d="M 620 250 V 186" marker-end="url(#cascadeArrow)"/>
  <text class="card" x="628" y="222">1 : 1</text>

  <!-- resumes -> ats_results : RESTRICT (Phase 5 — which resume was judged) -->
  <path class="rule" d="M 860 250 V 212 H 730 V 186" marker-end="url(#restrictArrow)"/>
  <text class="card" x="770" y="206">1 : N</text>

  <!-- resumes -> job_applications : RESTRICT (job_applications holds ResumeId) -->
  <path class="rule" d="M 760 311 H 720" marker-end="url(#restrictArrow)"/>
  <text class="card" x="722" y="304">1 : N</text>

  <!-- resumes -> resume_skills : CASCADE -->
  <path class="casc" d="M 860 336 V 400" marker-end="url(#cascadeArrow)"/>
  <text class="card" x="868" y="372">1 : N</text>

  <!-- resumes -> resume_experiences : CASCADE -->
  <path class="casc" d="M 960 293 H 1000" marker-end="url(#cascadeArrow)"/>
  <text class="card" x="962" y="286">1 : N</text>

  <!-- resumes -> resume_educations : CASCADE -->
  <path class="casc" d="M 940 336 V 368 H 1100 V 400" marker-end="url(#cascadeArrow)"/>
  <text class="card" x="1040" y="362">1 : N</text>

  <!-- skills -> posting_skills : RESTRICT -->
  <path class="rule" d="M 520 443 H 480" marker-end="url(#restrictArrow)"/>
  <text class="card" x="484" y="436">1 : N</text>

  <!-- skills -> resume_skills : RESTRICT -->
  <path class="rule" d="M 720 443 H 760" marker-end="url(#restrictArrow)"/>
  <text class="card" x="722" y="436">1 : N</text>

  <!-- ============ legend ============ -->
  <g>
    <rect x="700" y="560" width="540" height="100" rx="4" fill="#FFFFFF" stroke="#C9D2CE" stroke-width="1.5"/>
    <text class="name" x="716" y="586">Delete behaviour — the one genuine decision in this schema</text>

    <path class="rule" d="M 720 610 H 770" marker-end="url(#restrictArrow)"/>
    <text class="col" x="782" y="614">ON DELETE RESTRICT — 6 edges</text>
    <text class="type" x="782" y="630">never destroy a shared row or a record of what you did</text>

    <path class="casc" d="M 720 646 H 770" marker-end="url(#cascadeArrow)"/>
    <text class="col" x="782" y="650">ON DELETE CASCADE — 7 edges (children of an aggregate)</text>
  </g>

  <text class="sub" x="40" y="706">13 tables · 13 foreign keys (6 RESTRICT, 7 CASCADE) · 15 indexes, of which 5 are UNIQUE · enums stored as text, so rows read plainly in psql</text>
  <text class="sub" x="40" y="726">Boxes show keys only. Full column lists live in src/Data/AppDbContext.cs, where the reasoning for each delete rule is written beside it.</text>
</svg>
