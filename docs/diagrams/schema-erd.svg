    <rect class="tbl" x="500" y="480" width="220" height="86" rx="4"/>
    <path class="hdr" d="M500,484 a4,4 0 0 1 4,-4 h212 a4,4 0 0 1 4,4 v22 h-220 z"/>
    <rect x="500" y="480" width="220" height="86" rx="4" fill="none" stroke="#C9D2CE" stroke-width="1.5"/>
    <text class="name" x="512" y="501">ats_results</text>
    <text class="col"  x="512" y="525">Id</text><text class="tag" x="548" y="525">PK</text>
    <text class="col"  x="512" y="542">ApplicationId</text><text class="tag" x="600" y="542">UNIQUE</text>
    <text class="col"  x="512" y="559">ResumeId</text><text class="type" x="582" y="559">nullable, no FK</text>
  </g>

  <!-- ================= skills ================= -->
  <g>
    <rect class="tbl" x="500" y="730" width="220" height="68" rx="4"/>
