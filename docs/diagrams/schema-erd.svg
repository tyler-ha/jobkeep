    <text class="col"  x="852" y="185">Id</text><text class="tag" x="888" y="185">PK</text>
    <text class="type" x="852" y="202">no foreign keys, in or out · Status indexed</text>
    <text class="type" x="852" y="219">CommittedEntityId — résumé or application, so unkeyed</text>
  </g>

  <g>
    <rect class="tbl" x="840" y="260" width="370" height="68" rx="4"/>
    <path class="hdr" d="M840,264 a4,4 0 0 1 4,-4 h362 a4,4 0 0 1 4,4 v22 h-370 z"/>
    <rect x="840" y="260" width="370" height="68" rx="4" fill="none" stroke="#C9D2CE" stroke-width="1.5"/>
    <text class="name" x="852" y="281">resumes</text>
    <text class="col"  x="852" y="305">Id</text><text class="tag" x="888" y="305">PK</text>
    <text class="col"  x="852" y="322">LabelNormalized</text><text class="type" x="962" y="322">generated, lower(Label)</text><text class="tag" x="1108" y="322">UNIQUE</text>
  </g>

  <g>
    <rect class="tbl" x="840" y="380" width="370" height="64" rx="4"/>
    <path class="hdr" d="M840,384 a4,4 0 0 1 4,-4 h362 a4,4 0 0 1 4,4 v22 h-370 z"/>
    <rect x="840" y="380" width="370" height="64" rx="4" fill="none" stroke="#C9D2CE" stroke-width="1.5"/>
