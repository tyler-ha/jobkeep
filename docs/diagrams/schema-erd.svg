    <path class="hdr" d="M70,394 a4,4 0 0 1 4,-4 h312 a4,4 0 0 1 4,4 v22 h-320 z"/>
    <rect x="70" y="390" width="320" height="88" rx="4" fill="none" stroke="#C9D2CE" stroke-width="1.5"/>
    <text class="name" x="82" y="411">job_applications</text>
    <text class="col"  x="82" y="435">Id</text><text class="tag" x="118" y="435">PK</text>
    <text class="col"  x="82" y="452">PostingId</text><text class="tag" x="152" y="452">FK</text><text class="type" x="176" y="452">restrict · indexed</text>
    <text class="col"  x="82" y="469">ResumeId</text><text class="type" x="152" y="469">→ documents.resumes, no FK</text>
  </g>

  <g>
    <rect class="tbl" x="70" y="530" width="320" height="64" rx="4"/>
    <path class="hdr" d="M70,534 a4,4 0 0 1 4,-4 h312 a4,4 0 0 1 4,4 v22 h-320 z"/>
    <rect x="70" y="530" width="320" height="64" rx="4" fill="none" stroke="#C9D2CE" stroke-width="1.5"/>
    <text class="name" x="82" y="551">job_requirements</text>
    <text class="col"  x="82" y="575">Id</text><text class="tag" x="118" y="575">PK</text>
    <text class="col"  x="152" y="575">PostingId</text><text class="tag" x="222" y="575">FK</text><text class="type" x="246" y="575">cascade</text>
  </g>

  <g>
    <rect class="tbl" x="70" y="630" width="320" height="64" rx="4"/>
    <path class="hdr" d="M70,634 a4,4 0 0 1 4,-4 h312 a4,4 0 0 1 4,4 v22 h-320 z"/>
    <rect x="70" y="630" width="320" height="64" rx="4" fill="none" stroke="#C9D2CE" stroke-width="1.5"/>
    <text class="name" x="82" y="651">posting_skills</text>
    <text class="col"  x="82" y="675">PostingId, SkillId</text><text class="tag" x="200" y="675">PK</text>
    <text class="type" x="228" y="675">SkillId → skills, no FK</text>
  </g>

  <!-- ================= ai ================= -->
  <g>
    <rect class="tbl" x="500" y="150" width="220" height="68" rx="4"/>
    <path class="hdr" d="M500,154 a4,4 0 0 1 4,-4 h212 a4,4 0 0 1 4,4 v22 h-220 z"/>
    <rect x="500" y="150" width="220" height="68" rx="4" fill="none" stroke="#C9D2CE" stroke-width="1.5"/>
