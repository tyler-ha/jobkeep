    <text class="col"  x="82" y="312">CompanyId</text><text class="tag" x="158" y="312">FK</text><text class="type" x="182" y="312">restrict</text>
    <text class="type" x="82" y="329">SalaryMin/Max numeric(12,2) · 2 CHECKs</text>
