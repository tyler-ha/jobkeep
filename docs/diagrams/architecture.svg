<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1010" width="1160" height="1010" role="img" aria-labelledby="t d">
  <title id="t">JobKeep architecture — one deployable, ten projects, two API surfaces over one code path</title>
  <desc id="d">HTTP requests arrive at two API surfaces, both inside the Jobkeep.Api composition root: REST minimal-API routes and a HotChocolate GraphQL endpoint. Each surface has its own thin translation of an outcome — ToHttpResult renders a status code, ValueOrThrow raises a GraphQL error — but both call the same vertical-slice handler underneath, so neither can enforce a different rule. The one exception is the file upload, which is REST-only because GraphQL has no file type. Since Phase 13.1 each of the six modules is its own class-library project, and since 13.3b each owns its own EF Core DbContext, its own entities and its own PostgreSQL schema: Applications, Documents, Ats, Ai and Skills own tables; Analytics owns none and reads three published views. A module may never reference another module. Every crossing goes through Jobkeep.Contracts, which holds five interfaces and, since 13.3c, two delete events published by Applications and subscribed to by Ats and Ai — the seam that replaced two foreign keys the schema split had to drop. Two foundation projects sit under everything: Jobkeep.SharedKernel holds primitives and the domain-event publisher, Jobkeep.Persistence holds model-wide EF conventions and the audit interceptor. All six contexts share one connection string to one PostgreSQL database.</desc>

  <rect x="0" y="0" width="1160" height="1010" fill="#FBFCFB"/>

  <defs>
    <marker id="an" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#0E5F58"/>
    </marker>
    <marker id="ai" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#16211F"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#5B6C68"/>
    </marker>
  </defs>

  <style>
    .box   { fill:#FFFFFF; stroke:#C9D2CE; stroke-width:1.4; }
    .band  { fill:#F2F5F4; stroke:#C9D2CE; stroke-width:1; stroke-dasharray:4 4; }
    .h1    { fill:#16211F; font-size:19px; font-weight:600; }
    .sub   { fill:#5B6C68; font-size:12px; }
    .ttl   { fill:#16211F; font-size:13px; font-weight:600; }
    .txt   { fill:#16211F; font-size:11.5px; }
    .mut   { fill:#5B6C68; font-size:11px; }
    .acc   { fill:#0E5F58; font-size:11px; font-weight:600; }
    .flow  { stroke:#16211F; stroke-width:1.4; fill:none; }
    .soft  { stroke:#5B6C68; stroke-width:1.3; fill:none; stroke-dasharray:3 4; }
  </style>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">

    <text class="h1" x="40" y="40" font-family="'Segoe UI', Arial, sans-serif">JobKeep — architecture</text>
    <text class="sub" x="40" y="62" font-family="'Segoe UI', Arial, sans-serif">One deployable. Ten projects in src/. Two API surfaces, one code path. As of Phase 13.3c.</text>

    <!-- ============ HTTP entry ============ -->
    <rect class="box" x="510" y="86" width="140" height="32" rx="16"/>
    <text class="txt" x="580" y="107" text-anchor="middle">HTTP</text>

    <path class="flow" d="M580,118 V138 H330 V152" marker-end="url(#ai)"/>
    <path class="flow" d="M580,118 V138 H830 V152" marker-end="url(#ai)"/>

    <!-- ============ the two surfaces ============ -->
    <rect class="box" x="140" y="154" width="380" height="82" rx="5"/>
    <text class="ttl" x="156" y="176">REST — Api/Endpoints/</text>
    <text class="mut" x="156" y="196">27 minimal-API routes, mapped per module</text>
    <text class="mut" x="156" y="213">ToHttpResult →  200 · 204 · 400 · 404</text>
    <text class="acc" x="156" y="230">temporary shape: 13.5 replaces it with controllers</text>

    <rect class="box" x="640" y="154" width="380" height="82" rx="5"/>
    <text class="ttl" x="656" y="176">GraphQL — Api/GraphQL/</text>
    <text class="mut" x="656" y="196">HotChocolate at /graphql · Query + Mutation</text>
    <text class="mut" x="656" y="213">ValueOrThrow →  NOT_FOUND · INVALID_INPUT</text>
    <text class="acc" x="656" y="230">no EF entity is reachable from the schema</text>

    <path class="flow" d="M330,236 V266 H560" marker-end="url(#ai)"/>
    <path class="flow" d="M830,236 V266 H600" marker-end="url(#ai)"/>

    <!-- ============ the shared code path ============ -->
    <rect class="box" x="140" y="268" width="880" height="66" rx="5"/>
    <text class="ttl" x="156" y="291">one slice handler per use case  —  request + handler + response, in one file</text>
    <text class="mut" x="156" y="311">Validation and business rules live HERE, so the two surfaces cannot enforce different things.</text>
    <text class="mut" x="156" y="327">Returns SliceResult&lt;T&gt;; each surface translates it at its own edge. The upload is REST-only — GraphQL has no file type.</text>

    <path class="flow" d="M580,334 V368" marker-end="url(#ai)"/>
    <text class="mut" x="596" y="357">a use case belongs to exactly one module</text>

    <!-- ============ the six modules ============ -->
    <rect class="band" x="60" y="378" width="1040" height="292" rx="8"/>
    <text class="mut" x="76" y="398" font-weight="600">SIX MODULE PROJECTS  —  a module may never reference another module (ModuleBoundaryTests)</text>

    <rect class="box" x="80" y="410" width="320" height="112" rx="5"/>
    <text class="ttl" x="94" y="432">Applications</text>
    <text class="mut" x="94" y="452">ApplicationsDbContext</text>
    <text class="txt" x="94" y="470">schema  applications</text>
    <text class="mut" x="94" y="487">5 tables + the 3 published views</text>
    <text class="acc" x="94" y="507">publishes ApplicationDeleted · PostingDeleted</text>

    <rect class="box" x="420" y="410" width="320" height="112" rx="5"/>
    <text class="ttl" x="434" y="432">Documents</text>
    <text class="mut" x="434" y="452">DocumentsDbContext</text>
    <text class="txt" x="434" y="470">schema  documents</text>
    <text class="mut" x="434" y="487">5 tables · imports, résumés, parsed records</text>
    <text class="acc" x="434" y="507">owns IResumeContract</text>

    <rect class="box" x="760" y="410" width="320" height="112" rx="5"/>
    <text class="ttl" x="774" y="432">Ats</text>
    <text class="mut" x="774" y="452">AtsDbContext</text>
    <text class="txt" x="774" y="470">schema  ats</text>
    <text class="mut" x="774" y="487">1 table · reads 5 it does not own, by contract</text>
    <text class="acc" x="774" y="507">subscribes ApplicationDeleted</text>

    <rect class="box" x="80" y="542" width="320" height="112" rx="5"/>
    <text class="ttl" x="94" y="564">Ai</text>
    <text class="mut" x="94" y="584">AiDbContext</text>
    <text class="txt" x="94" y="602">schema  ai</text>
    <text class="mut" x="94" y="619">1 table · IChatClient is shared, not owned</text>
    <text class="acc" x="94" y="639">subscribes PostingDeleted</text>

    <rect class="box" x="420" y="542" width="320" height="112" rx="5"/>
    <text class="ttl" x="434" y="564">Skills</text>
    <text class="mut" x="434" y="584">SkillsDbContext</text>
    <text class="txt" x="434" y="602">schema  skills</text>
    <text class="mut" x="434" y="619">1 table · the shared vocabulary, no routes</text>
    <text class="acc" x="434" y="639">owns ISkillCatalog</text>

    <rect class="box" x="760" y="542" width="320" height="112" rx="5"/>
    <text class="ttl" x="774" y="564">Analytics</text>
    <text class="mut" x="774" y="584">AnalyticsDbContext</text>
    <text class="txt" x="774" y="602">no schema, no migrations</text>
    <text class="mut" x="774" y="619">read-only · 3 views owned by Applications</text>
    <text class="acc" x="774" y="639">GROUP BY runs in Postgres, never in C#</text>

    <!-- ============ contracts ============ -->
    <path class="soft" d="M580,670 V700" marker-end="url(#ag)"/>

    <rect class="box" x="60" y="702" width="1040" height="94" rx="5"/>
    <text class="ttl" x="76" y="724">Jobkeep.Contracts  —  the only path between modules, and the wire schema when one is extracted</text>
    <text class="mut" x="76" y="746">IApplicationContract   IPostingContract   IResumeContract   ISkillCatalog   IAtsContract</text>
    <text class="mut" x="76" y="765">ApplicationDeleted   PostingDeleted        events, published after commit, delivered in process</text>
    <text class="acc" x="76" y="786">References no other Jobkeep assembly. An interface is implemented by the module that owns the table.</text>

    <!-- ============ database ============ -->
    <rect class="box" x="60" y="818" width="700" height="88" rx="5"/>
    <text class="ttl" x="76" y="840">PostgreSQL  —  one database, one connection string</text>
    <text class="mut" x="76" y="860">six DbContexts · five schemas · five __EFMigrationsHistory tables</text>
    <text class="mut" x="76" y="878">applications   skills   documents   ai   ats</text>
    <text class="acc" x="76" y="897">7 foreign keys left, all intra-schema. The 6 that crossed are enforced in code.</text>

    <!-- ============ foundations ============ -->
    <rect class="box" x="780" y="818" width="320" height="88" rx="5"/>
    <text class="ttl" x="796" y="840">Foundations</text>
    <text class="mut" x="796" y="860">SharedKernel — SliceResult, NaturalKey,</text>
    <text class="mut" x="796" y="877">IAuditable, the domain-event publisher</text>
    <text class="mut" x="796" y="894">Persistence — EF conventions, audit interceptor</text>

    <!-- ============ composition root note ============ -->
    <rect class="band" x="60" y="930" width="1040" height="54" rx="6"/>
    <text class="mut" x="76" y="952" font-weight="600">Jobkeep.Api  —  the composition root. References everything; nothing references it.</text>
    <text class="mut" x="76" y="971">Program.cs is wiring only: DI, middleware, six AddDbContext, five Migrate(), and the Add*/Map* call per module.</text>

  </g>
</svg>
