<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="JobKeep">
  <!-- Marked Up, at 16px: lines of text with one of them run through by the
       marker. Deliberately not a letterform — a "J" turns to mush in a tab. -->
  <rect width="32" height="32" rx="7" fill="#f7f5f1" />
  <g fill="#16181d">
    <rect x="6" y="8" width="20" height="2.6" rx="1.3" />
    <rect x="6" y="21.4" width="13" height="2.6" rx="1.3" />
  </g>
  <!-- the swipe sits under the middle line, ends uneven, very slightly tilted -->
  <g transform="rotate(-2 16 16)">
    <rect x="4.4" y="13.1" width="23.2" height="6.4" rx="2.4" fill="#ffc53d" />
  </g>
  <rect x="6" y="14.7" width="17" height="2.6" rx="1.3" fill="#16181d" />
</svg>
