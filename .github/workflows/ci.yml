name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    # ubuntu-latest ships a working Docker daemon, which the integration tests need:
    # they start a real postgres:16-alpine container via Testcontainers rather than
    # substituting an in-memory provider.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # One SDK since Phase 2.6. The projects target net10.0, so the 10.0 runtime
          # executes the tests; the same SDK is also the one that understands the
          # `test.runner` section in global.json, which points `dotnet test` at
          # Microsoft.Testing.Platform (the runner xunit.v3 ships). Before 2.6 this
          # needed 8.0.x alongside it, for the net8.0 target.
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Jobkeep.slnx

      - name: Build
        run: dotnet build src/Jobkeep.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --project tests/Jobkeep.Tests/Jobkeep.Tests.csproj --no-restore --configuration Release
