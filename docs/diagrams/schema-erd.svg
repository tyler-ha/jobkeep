<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730" role="img" aria-labelledby="t d">
  <title id="t">JobKeep database schema</title>
  <desc id="d">Entity relationship diagram of the JobKeep PostgreSQL schema. job_postings is the hub. companies has many job_postings, delete restricted. job_postings has many job_requirements, one ai_analyses row, and many posting_skills, all cascading on delete. skills has many posting_skills, delete restricted. job_postings has many job_applications, delete restricted. Each job_application has one ats_results row, cascading on delete.</desc>

