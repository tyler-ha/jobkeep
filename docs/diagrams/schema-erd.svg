    <rect x="500" y="730" width="220" height="68" rx="4" fill="none" stroke="#C9D2CE" stroke-width="1.5"/>
    <text class="name" x="512" y="751">skills</text>
    <text class="col"  x="512" y="775">Id</text><text class="tag" x="548" y="775">PK</text>
    <text class="col"  x="512" y="792">NameNormalized</text><text class="tag" x="622" y="792">UNIQUE</text>
  </g>

  <!-- ================= documents ================= -->
  <g>
    <rect class="tbl" x="840" y="140" width="370" height="86" rx="4"/>
    <path class="hdr" d="M840,144 a4,4 0 0 1 4,-4 h362 a4,4 0 0 1 4,4 v22 h-370 z"/>
    <rect x="840" y="140" width="370" height="86" rx="4" fill="none" stroke="#C9D2CE" stroke-width="1.5"/>
