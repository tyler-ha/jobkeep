  <rect class="grp" x="30"  y="95"  width="400" height="630" rx="8"/>
  <text class="glbl" x="44" y="115">SCHEMA  applications  —  module: Applications</text>

  <rect class="grp" x="470" y="110" width="280" height="130" rx="8"/>
  <text class="glbl" x="484" y="130">SCHEMA  ai  —  Ai</text>

  <rect class="grp" x="470" y="440" width="280" height="160" rx="8"/>
  <text class="glbl" x="484" y="460">SCHEMA  ats  —  Ats</text>

  <rect class="grp" x="470" y="690" width="280" height="140" rx="8"/>
  <text class="glbl" x="484" y="710">SCHEMA  skills  —  Skills</text>

  <rect class="grp" x="800" y="95"  width="440" height="565" rx="8"/>
  <text class="glbl" x="814" y="115">SCHEMA  documents  —  Documents</text>

  <!-- ================= edges (drawn under the boxes) ================= -->

  <!-- surviving foreign keys, all within one schema -->
  <path class="rule" d="M230,208 V250" marker-end="url(#restrictArrow)"/>
  <text class="card" x="238" y="233">1 : N</text>

  <path class="rule" d="M230,338 V390" marker-end="url(#restrictArrow)"/>
  <text class="card" x="238" y="368">1 : N</text>

  <path class="casc" d="M70,294 H50 V562 H70" marker-end="url(#cascadeArrow)"/>
  <path class="casc" d="M70,294 H50 V662 H70" marker-end="url(#cascadeArrow)"/>
  <text class="card" x="54" y="508">1 : N</text>

  <path class="casc" d="M1025,328 V380" marker-end="url(#cascadeArrow)"/>
  <text class="card" x="1033" y="358">1 : N</text>

  <path class="casc" d="M840,300 H820 V502 H840" marker-end="url(#cascadeArrow)"/>
  <path class="casc" d="M840,300 H820 V592 H840" marker-end="url(#cascadeArrow)"/>
  <text class="card" x="804" y="458">1 : N</text>

  <!-- boundary crossings: no foreign key since 13.3b, replaced in code at 13.3c -->
  <path class="code" d="M390,285 H445 V185 H500" marker-end="url(#codeArrow)"/>
  <text class="card" x="452" y="176">1 : 1</text>

  <path class="code" d="M390,455 H440 V520 H500" marker-end="url(#codeArrow)"/>
  <text class="card" x="446" y="512">1 : 1</text>

  <path class="code" d="M840,280 H780 V430 H390" marker-end="url(#codeArrow)"/>
  <text class="card" x="470" y="423">1 : N</text>

  <path class="code" d="M840,315 H770 V520 H750" marker-end="url(#codeArrow)"/>
  <text class="card" x="756" y="342">1 : N</text>

  <path class="code" d="M500,765 H450 V662 H390" marker-end="url(#codeArrow)"/>
  <text class="card" x="458" y="702">1 : N</text>

  <path class="code" d="M750,765 H790 V592 H840" marker-end="url(#codeArrow)"/>
  <text class="card" x="796" y="700">1 : N</text>

