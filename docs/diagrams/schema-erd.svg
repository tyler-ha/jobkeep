<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 935" width="1300" height="935" role="img" aria-labelledby="erdTitle erdDesc" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="erdTitle">JobKeep database schema, as of Phase 13.3b — thirteen tables across five PostgreSQL schemas</title>
  <desc id="erdDesc">Entity-relationship diagram of 13 PostgreSQL tables, split across five schemas that match the five table-owning modules: applications (companies, job_postings, job_applications, job_requirements, posting_skills), skills (skills), documents (document_imports, resumes, resume_experiences, resume_educations, resume_skills), ai (ai_analyses) and ats (ats_results). Seven foreign keys remain, all of them inside a single schema: two ON DELETE RESTRICT, drawn as solid dark-green arrows, and five ON DELETE CASCADE, drawn as dashed rust arrows. Six further relationships cross a schema boundary and no longer have a foreign key at all — Phase 13.3b dropped them so that a module can be extracted as a service, and Phase 13.3c replaced each one with application code: two delete notifications, two contract checks at delete time, and two find-or-create orderings through the shared skill catalog. Those six are drawn as dotted grey arrows. The applications schema also holds three views that the Analytics module reads. Since Phase 7 the uniqueness of companies, skills and resumes is enforced on a STORED generated column holding the lower-cased name, not on the name itself.</desc>

  <rect x="0" y="0" width="1300" height="935" fill="#FBFCFB"/>

  <defs>
    <marker id="restrictArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E5F58"/>
    </marker>
    <marker id="cascadeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A8402F"/>
    </marker>
    <marker id="codeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6C68"/>
    </marker>
  </defs>

  <style>
    .tbl   { fill:#FFFFFF; stroke:#C9D2CE; stroke-width:1.5; }
    .hdr   { fill:#E8EEEB; }
    .grp   { fill:#F2F5F4; stroke:#C9D2CE; stroke-width:1; stroke-dasharray:4 4; }
    .glbl  { fill:#5B6C68; font-size:12px; font-weight:600; letter-spacing:0.6px; }
    .name  { fill:#16211F; font-size:14.5px; font-weight:600; }
    .col   { fill:#16211F; font-size:11.5px; }
    .type  { fill:#5B6C68; font-size:11.5px; }
    .card  { fill:#5B6C68; font-size:11px; }
    .rule  { stroke:#0E5F58; stroke-width:2; fill:none; }
    .casc  { stroke:#A8402F; stroke-width:2; fill:none; stroke-dasharray:7 4; }
    .code  { stroke:#5B6C68; stroke-width:1.8; fill:none; stroke-dasharray:2 5; }
    .h1    { fill:#16211F; font-size:20px; font-weight:600; }
    .sub   { fill:#5B6C68; font-size:12.5px; }
    .tag   { fill:#0E5F58; font-size:10.5px; font-weight:600; }
  </style>

  <text class="h1" x="40" y="42">JobKeep — database schema</text>
  <text class="sub" x="40" y="64">13 tables in 5 schemas, one per table-owning module. Read from `pg_dump --schema-only`, Phase 13.3c.</text>

