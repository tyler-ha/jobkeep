    <text class="col"  x="852" y="425">Id</text><text class="tag" x="888" y="425">PK</text>
    <text class="col"  x="922" y="425">ResumeId</text><text class="tag" x="992" y="425">FK</text><text class="type" x="1016" y="425">cascade</text>
  </g>

  <g>
    <rect class="tbl" x="840" y="470" width="370" height="64" rx="4"/>
    <path class="hdr" d="M840,474 a4,4 0 0 1 4,-4 h362 a4,4 0 0 1 4,4 v22 h-370 z"/>
    <rect x="840" y="470" width="370" height="64" rx="4" fill="none" stroke="#C9D2CE" stroke-width="1.5"/>
    <text class="name" x="852" y="491">resume_educations</text>
    <text class="col"  x="852" y="515">Id</text><text class="tag" x="888" y="515">PK</text>
    <text class="col"  x="922" y="515">ResumeId</text><text class="tag" x="992" y="515">FK</text><text class="type" x="1016" y="515">cascade</text>
  </g>

  <g>
    <rect class="tbl" x="840" y="560" width="370" height="64" rx="4"/>
    <path class="hdr" d="M840,564 a4,4 0 0 1 4,-4 h362 a4,4 0 0 1 4,4 v22 h-370 z"/>
    <rect x="840" y="560" width="370" height="64" rx="4" fill="none" stroke="#C9D2CE" stroke-width="1.5"/>
    <text class="name" x="852" y="581">resume_skills</text>
    <text class="col"  x="852" y="605">ResumeId, SkillId</text><text class="tag" x="970" y="605">PK</text>
    <text class="type" x="998" y="605">SkillId → skills, no FK</text>
  </g>

  <!-- ================= legend ================= -->
  <g>
    <rect x="470" y="250" width="280" height="160" rx="6" fill="#FFFFFF" stroke="#C9D2CE" stroke-width="1"/>
    <text class="name" x="484" y="272" font-size="13">Edges</text>

    <path class="rule" d="M486,290 H520" marker-end="url(#restrictArrow)"/>
    <text class="col" x="532" y="294">FK · ON DELETE RESTRICT</text>
    <text class="type" x="532" y="309">2 remain, both intra-schema</text>

    <path class="casc" d="M486,330 H520" marker-end="url(#cascadeArrow)"/>
    <text class="col" x="532" y="334">FK · ON DELETE CASCADE</text>
    <text class="type" x="532" y="349">5 remain, all intra-schema</text>

    <path class="code" d="M486,370 H520" marker-end="url(#codeArrow)"/>
    <text class="col" x="532" y="374">no FK — crosses a schema</text>
    <text class="type" x="532" y="389">6, enforced in code since 13.3c</text>
  </g>

  <!-- ================= footer ================= -->
  <text class="sub" x="40" y="862">13 tables · 3 views (applications, read by Analytics) · 7 foreign keys (5 cascade / 2 restrict) · 5 unique indexes · 10 plain indexes</text>
  <text class="sub" x="40" y="884">Phase 13.3b dropped the 6 foreign keys that crossed a module boundary. 13.3c replaced each: 2 delete notifications</text>
  <text class="sub" x="40" y="902">(ApplicationDeleted → ats_results, PostingDeleted → ai_analyses), 2 contract checks before a résumé delete, and 2 find-or-create</text>
  <text class="sub" x="40" y="920">orderings through ISkillCatalog. A dotted edge is a rule Postgres no longer knows about — that is the price of a service boundary.</text>
</svg>
